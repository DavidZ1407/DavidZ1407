<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" role="img" aria-label="Golden ornament with a glowing blue orb travelling along the line">
  <defs>
    <linearGradient id="GlowBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#3FC6DA" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#3FC6DA" stop-opacity="0.22"/>
      <stop offset="0.85" stop-color="#3FC6DA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="BlueGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="OrbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8FAFC" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#3FC6DA" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft blue glow band across the middle -->
  <rect x="18" y="16" width="224" height="12" fill="url(#GlowBand)"/>

  <!-- pulsing glow behind the center diamond -->
  <circle cx="130" cy="22" r="11" fill="url(#BlueGlow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- golden lines -->
  <line x1="18" y1="22" x2="107" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.5"/>
  <line x1="153" y1="22" x2="242" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.5"/>

  <!-- end dots -->
  <circle cx="18" cy="22" r="1.5" fill="#C9A45C" opacity="0.6"/>
  <circle cx="242" cy="22" r="1.5" fill="#C9A45C" opacity="0.6"/>

  <!-- small side diamonds -->
  <path d="M53 22 L56 19 L59 22 L56 25 Z" fill="#C9A45C" opacity="0.45"/>
  <path d="M201 22 L204 19 L207 22 L204 25 Z" fill="#C9A45C" opacity="0.45"/>
  <path d="M109 22 L112 19 L115 22 L112 25 Z" fill="#C9A45C" opacity="0.6"/>
  <path d="M145 22 L148 19 L151 22 L148 25 Z" fill="#C9A45C" opacity="0.6"/>

  <!-- center diamond -->
  <path d="M130 9 L140 22 L130 35 L120 22 Z" fill="none" stroke="#C9A45C" stroke-width="1.2" opacity="0.9"/>
  <path d="M130 13.5 L134.5 22 L130 30.5 L125.5 22 Z" fill="#C9A45C" opacity="0.9"/>

  <!-- travelling blue orb (glow + core) -->
  <circle cy="22" r="9" fill="url(#OrbGlow)">
    <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cy="22" r="2.8" fill="#E8FAFC">
    <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
