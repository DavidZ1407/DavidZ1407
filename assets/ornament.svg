<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" role="img" aria-label="Golden ornament with a strongly glowing blue orb travelling along the line">
  <defs>
    <linearGradient id="GlowBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#4FE3FF" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#4FE3FF" stop-opacity="0.55"/>
      <stop offset="0.88" stop-color="#4FE3FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="DimGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FE3FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4FE3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="DiamondGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8BF0FF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#3FC6DA" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="OrbGlowOuter" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="OrbGlowInner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E9FEFF" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#7BEAF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2BB6D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- strong blue glow band across the middle -->
  <rect x="18" y="14" width="224" height="16" fill="url(#GlowBand)"/>

  <!-- pulsing blue glow behind the center diamond -->
  <circle cx="130" cy="22" r="16" fill="url(#DimGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="22" r="9" fill="url(#DiamondGlow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- golden lines -->
  <line x1="18" y1="22" x2="107" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.55"/>
  <line x1="153" y1="22" x2="242" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.55"/>

  <!-- end dots -->
  <circle cx="18" cy="22" r="1.5" fill="#C9A45C" opacity="0.7"/>
  <circle cx="242" cy="22" r="1.5" fill="#C9A45C" opacity="0.7"/>

  <!-- small side diamonds -->
  <path d="M53 22 L56 19 L59 22 L56 25 Z" fill="#C9A45C" opacity="0.5"/>
  <path d="M201 22 L204 19 L207 22 L204 25 Z" fill="#C9A45C" opacity="0.5"/>
  <path d="M109 22 L112 19 L115 22 L112 25 Z" fill="#C9A45C" opacity="0.65"/>
  <path d="M145 22 L148 19 L151 22 L148 25 Z" fill="#C9A45C" opacity="0.65"/>

  <!-- center diamond -->
  <path d="M130 9 L140 22 L130 35 L120 22 Z" fill="none" stroke="#C9A45C" stroke-width="1.2" opacity="0.95"/>
  <path d="M130 13.5 L134.5 22 L130 30.5 L125.5 22 Z" fill="#C9A45C" opacity="0.95"/>

  <!-- travelling blue orb: layered glow -->
  <g>
    <!-- wide outer halo -->
    <circle cy="22" r="14" fill="url(#OrbGlowOuter)">
      <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <!-- bright glow + ring -->
    <circle cy="22" r="8" fill="url(#OrbGlowInner)">
      <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cy="22" r="5.5" fill="none" stroke="#9FF1FF" stroke-width="1.3">
      <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- hot core -->
    <circle cy="22" r="3" fill="#F2FEFF">
      <animate attributeName="cx" values="18;242;18" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small trailing satellite spark -->
  <circle cy="22" r="1.4" fill="#8BF0FF">
    <animate attributeName="cx" values="12;248;12" dur="7s" begin="-2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
