<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" role="img" aria-label="Golden ornament with a strongly glowing blue orb travelling along the line">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FE3FF" stop-opacity="0.65"/>
      <stop offset="0.6" stop-color="#3FC6DA" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#7BEAF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2BB6D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- golden lines -->
  <line x1="18" y1="22" x2="107" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.55"/>
  <line x1="153" y1="22" x2="242" y2="22" stroke="#C9A45C" stroke-width="1" opacity="0.55"/>

  <!-- end dots -->
  <circle cx="18" cy="22" r="1.5" fill="#C9A45C" opacity="0.7"/>
  <circle cx="242" cy="22" r="1.5" fill="#C9A45C" opacity="0.7"/>

  <!-- small side diamonds -->
  <path d="M53 22 L56 19 L59 22 L56 25 Z" fill="#C9A45C" opacity="0.5"/>
  <path d="M201 22 L204 19 L207 22 L204 25 Z" fill="#C9A45C" opacity="0.5"/>
  <path d="M109 22 L112 19 L115 22 L112 25 Z" fill="#C9A45C" opacity="0.65"/>
  <path d="M145 22 L148 19 L151 22 L148 25 Z" fill="#C9A45C" opacity="0.65"/>

  <!-- center diamond -->
  <path d="M130 9 L140 22 L130 35 L120 22 Z" fill="none" stroke="#C9A45C" stroke-width="1.2" opacity="0.95"/>
  <path d="M130 13.5 L134.5 22 L130 30.5 L125.5 22 Z" fill="#C9A45C" opacity="0.95"/>

  <!-- travelling blue orb: strong glow -->
  <g>
    <animate attributeName="opacity" values="0.55;0.3;0.15;1;0.75;0.55;0.15;0.15;1;0.6" dur="10s" repeatCount="indefinite"/>

    <!-- wide bright glow -->
    <circle cy="22" r="20" fill="url(#halo)">
      <animate attributeName="cx" values="18;242;18" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- strong glow -->
    <circle cy="22" r="12" fill="url(#orbGlow)">
      <animate attributeName="cx" values="18;242;18" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- bright ring -->
    <circle cy="22" r="7" fill="none" stroke="#9FE8FF" stroke-width="1.1">
      <animate attributeName="cx" values="18;242;18" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- hot white core -->
    <circle cy="22" r="4" fill="#FFFFFF">
      <animate attributeName="cx" values="18;242;18" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
