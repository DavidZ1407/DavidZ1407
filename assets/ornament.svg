<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" role="img" aria-label="Glowing blue orb">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E4FBFE" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#5FCEE0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#2BB6D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g>
    <!-- intermittent glow: mostly dim, lights up every now and then -->
    <animate attributeName="opacity" values="0.35;0.15;0.1;1;0.45;0.35;0.12;0.12;0.9;0.35" dur="10s" repeatCount="indefinite"/>

    <!-- outer halo -->
    <circle cy="30" r="18" fill="url(#halo)">
      <animate attributeName="cx" values="22;178;22" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- glow -->
    <circle cy="30" r="9" fill="url(#orbGlow)">
      <animate attributeName="cx" values="22;178;22" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- soft ring -->
    <circle cy="30" r="6" fill="none" stroke="#7FD3E0" stroke-width="0.8">
      <animate attributeName="cx" values="22;178;22" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- core -->
    <circle cy="30" r="3" fill="#E4FBFE">
      <animate attributeName="cx" values="22;178;22" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
