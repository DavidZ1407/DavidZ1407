<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 32" width="240" height="32" role="img" aria-label="Golden ornament separator">
  <defs>
    <radialGradient id="oGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A45C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9A45C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft pulsing glow behind the diamond -->
  <circle cx="120" cy="16" r="11" fill="url(#oGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- thin lines -->
  <line x1="18" y1="16" x2="102" y2="16" stroke="#C9A45C" stroke-width="1" opacity="0.5"/>
  <line x1="138" y1="16" x2="222" y2="16" stroke="#C9A45C" stroke-width="1" opacity="0.5"/>

  <!-- end dots -->
  <circle cx="18" cy="16" r="1.4" fill="#C9A45C" opacity="0.6"/>
  <circle cx="222" cy="16" r="1.4" fill="#C9A45C" opacity="0.6"/>

  <!-- small side diamonds -->
  <path d="M104 16 L107 13 L110 16 L107 19 Z" fill="#C9A45C" opacity="0.55"/>
  <path d="M130 16 L133 13 L136 16 L133 19 Z" fill="#C9A45C" opacity="0.55"/>

  <!-- center diamond -->
  <path d="M120 8.5 L127.5 16 L120 23.5 L112.5 16 Z" fill="none" stroke="#C9A45C" stroke-width="1.2" opacity="0.9"/>
  <path d="M120 12.5 L123.5 16 L120 19.5 L116.5 16 Z" fill="#C9A45C" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.45;0.9" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- tiny twinkling accents -->
  <circle cx="88" cy="12" r="1" fill="#E3C98A">
    <animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="152" cy="20" r="1" fill="#6FB5AC">
    <animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>
