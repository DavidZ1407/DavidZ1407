<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" width="1400" height="360" role="img" aria-label="David Zahn - Games and Immersive Media. Dark hall with golden light streaks, floating dust and gothic arches.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1719"/>
      <stop offset="0.55" stop-color="#0A1315"/>
      <stop offset="1" stop-color="#060C0D"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.08" r="1">
      <stop offset="0" stop-color="#1E3A38" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#14282A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8B2" stop-opacity="0.13"/>
      <stop offset="0.7" stop-color="#8FB8B2" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#8FB8B2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#020505" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#020505" stop-opacity="0"/>
      <stop offset="1" stop-color="#020505" stop-opacity="0.6"/>
    </radialGradient>
    <style>
      .streak { animation: flicker 9s ease-in-out infinite alternate; }
      .s2 { animation-duration: 13s; animation-delay: -4s; }
      .s3 { animation-duration: 17s; animation-delay: -8s; }
      @keyframes flicker { from { opacity: 0.55; } to { opacity: 1; } }
      .dust { animation: rise 15s linear infinite; }
      .d2 { animation-duration: 20s; animation-delay: -7s; }
      .d3 { animation-duration: 25s; animation-delay: -13s; }
      @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: 0.5; } 85% { opacity: 0.3; } 100% { transform: translateY(-380px); opacity: 0; } }
      .tw { animation: twinkle 5s ease-in-out infinite alternate; }
      .t2 { animation-duration: 7s; animation-delay: -2.5s; }
      .t3 { animation-duration: 9s; animation-delay: -5s; }
      @keyframes twinkle { from { opacity: 0.1; } to { opacity: 0.55; } }
    </style>
  </defs>

  <rect width="1400" height="360" fill="url(#bg)"/>
  <rect width="1400" height="360" fill="url(#haze)"/>

  <!-- vertical light streaks -->
  <g>
    <rect class="streak" x="205" y="0" width="2" height="360" fill="#8FB8B2" opacity="0.13"/>
    <rect class="streak s2" x="415" y="0" width="1.5" height="360" fill="#9CC4BE" opacity="0.09"/>
    <rect class="streak s3" x="610" y="0" width="2.5" height="360" fill="#8FB8B2" opacity="0.11"/>
    <rect class="streak" x="805" y="0" width="1.5" height="360" fill="#9CC4BE" opacity="0.09"/>
    <rect class="streak s2" x="1000" y="0" width="2" height="360" fill="#8FB8B2" opacity="0.13"/>
    <rect class="streak s3" x="1195" y="0" width="1.5" height="360" fill="#9CC4BE" opacity="0.09"/>
    <polygon class="streak s2" points="492,0 508,0 496,360 478,360" fill="url(#beam)"/>
    <polygon class="streak s3" points="892,0 908,0 924,360 908,360" fill="url(#beam)"/>
    <polygon class="streak" points="268,0 282,0 264,360 248,360" fill="url(#beam)"/>
    <polygon class="streak s2" points="1108,0 1122,0 1146,360 1130,360" fill="url(#beam)"/>
  </g>

  <!-- gothic arches, thin gold line art -->
  <g fill="none" stroke="#C9A45C">
    <path d="M350 330 L350 230 Q 362 92 700 40 Q 1038 92 1050 230 L1050 330" stroke-width="1.4" opacity="0.2"/>
    <path d="M350 170 L1050 170" stroke-width="0.8" opacity="0.13"/>
    <path d="M700 40 L700 170" stroke-width="0.8" opacity="0.12"/>
    <path d="M120 330 L120 240 Q 126 172 210 150 Q 294 172 300 240 L300 330" stroke-width="1" opacity="0.11"/>
    <path d="M1100 330 L1100 240 Q 1106 172 1190 150 Q 1274 172 1280 240 L1280 330" stroke-width="1" opacity="0.11"/>
  </g>

  <!-- ornamental golden frame -->
  <rect x="14" y="14" width="1372" height="332" fill="none" stroke="#C9A45C" stroke-width="1" opacity="0.35"/>
  <g fill="none" stroke="#C9A45C" stroke-width="2" opacity="0.8">
    <path d="M14 36 L14 14 L36 14"/>
    <path d="M1364 14 L1386 14 L1386 36"/>
    <path d="M1386 324 L1386 346 L1364 346"/>
    <path d="M36 346 L14 346 L14 324"/>
  </g>
  <path d="M692 14 L700 6 L708 14 L700 22 Z" fill="#C9A45C" opacity="0.75"/>
  <path d="M692 346 L700 338 L708 346 L700 354 Z" fill="#C9A45C" opacity="0.75"/>

  <!-- hero text -->
  <text x="700" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="9" fill="#C9A45C">GAMES &amp; IMMERSIVE MEDIA</text>
  <g fill="#C9A45C">
    <line x1="505" y1="146" x2="662" y2="146" stroke="#C9A45C" stroke-width="1" opacity="0.7"/>
    <line x1="738" y1="146" x2="895" y2="146" stroke="#C9A45C" stroke-width="1" opacity="0.7"/>
    <path d="M700 138 L707 146 L700 154 L693 146 Z" opacity="0.95"/>
    <path d="M668 141.5 L673 146 L668 150.5 L663 146 Z" opacity="0.65"/>
    <path d="M732 141.5 L737 146 L732 150.5 L727 146 Z" opacity="0.65"/>
  </g>
  <text x="700" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="12" fill="#F0EDE6">DAVID ZAHN</text>
  <text x="700" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="4" fill="#6FB5AC">GAMEPLAY PROGRAMMING · SYSTEMS DESIGN · 3D ART</text>

  <!-- rising golden dust -->
  <g fill="#D8C9A3">
    <g class="dust"><circle cx="250" cy="380" r="2"/><circle cx="268" cy="398" r="1.3"/></g>
    <g class="dust d2"><circle cx="640" cy="380" r="1.6"/><circle cx="622" cy="396" r="1.1"/></g>
    <g class="dust d3"><circle cx="1050" cy="380" r="2"/><circle cx="1068" cy="394" r="1.2"/></g>
  </g>

  <!-- twinkling particles -->
  <g fill="#D8C9A3">
    <circle class="tw" cx="180" cy="80" r="1.6"/>
    <circle class="tw t2" cx="380" cy="150" r="1.2"/>
    <circle class="tw t3" cx="520" cy="60" r="1.4"/>
    <circle class="tw" cx="980" cy="120" r="1.3"/>
    <circle class="tw t2" cx="1230" cy="70" r="1.6"/>
    <circle class="tw t3" cx="1120" cy="200" r="1.1"/>
  </g>
  <g fill="#9CC4BE">
    <circle class="tw t2" cx="300" cy="230" r="1.2"/>
    <circle class="tw" cx="1180" cy="120" r="1.2"/>
    <circle class="tw t3" cx="850" cy="55" r="1.3"/>
  </g>
  <g fill="#D8C9A3" opacity="0.25">
    <circle cx="90" cy="250" r="1.2"/><circle cx="1310" cy="260" r="1.4"/>
    <circle cx="450" cy="300" r="1"/><circle cx="960" cy="310" r="1.1"/>
  </g>

  <rect width="1400" height="360" fill="url(#vig)"/>
</svg>
