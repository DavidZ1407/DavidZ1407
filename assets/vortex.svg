<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="Rotating water vortex">
  <defs>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3FC6DA" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3FC6DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="30" cy="30" r="26" fill="url(#glowA)"/>

  <!-- outer ring (static) -->
  <circle cx="30" cy="30" r="18" fill="none" stroke="#3FC6DA" stroke-width="1" opacity="0.55"/>

  <!-- rotating dashed halo (clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="18s" repeatCount="indefinite"/>
    <circle cx="30" cy="30" r="22" fill="none" stroke="#3FC6DA" stroke-width="0.8" stroke-dasharray="2 5" opacity="0.5"/>
    <circle cx="52" cy="30" r="1.2" fill="#7FE0EC" opacity="0.9"/>
  </g>

  <!-- main swirl (rotating clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="10s" repeatCount="indefinite"/>
    <path d="M30 12 C 40 12, 48 20, 48 30 C 48 38, 42 44, 34 45" fill="none" stroke="#7FE0EC" stroke-width="1.2" opacity="0.8" stroke-linecap="round"/>
    <path d="M30 48 C 20 48, 12 40, 12 30 C 12 22, 18 16, 26 15" fill="none" stroke="#7FE0EC" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
    <path d="M30 30 C 33 26, 30 20, 25 20" fill="none" stroke="#B8F0F7" stroke-width="0.8" opacity="0.7" stroke-linecap="round"/>
    <circle cx="43" cy="21" r="1" fill="#B8F0F7" opacity="0.9"/>
    <circle cx="17" cy="38" r="0.9" fill="#7FE0EC" opacity="0.8"/>
  </g>

  <!-- counter-rotating inner swirl -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 30 30" to="0 30 30" dur="14s" repeatCount="indefinite"/>
    <path d="M30 22 C 25 24, 23 28, 24 33" fill="none" stroke="#B8F0F7" stroke-width="0.8" opacity="0.75" stroke-linecap="round"/>
    <path d="M36 37 C 39 34, 39 29, 36 26" fill="none" stroke="#7FE0EC" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>
    <circle cx="24" cy="33" r="0.8" fill="#B8F0F7" opacity="0.9"/>
  </g>

  <!-- core -->
  <circle cx="30" cy="30" r="4.5" fill="#3FC6DA" opacity="0.18"/>
  <circle cx="30" cy="30" r="2" fill="#B8F0F7" opacity="0.85"/>
</svg>

